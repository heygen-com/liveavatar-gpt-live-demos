<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>poker-table</title>
    <!--
      Hyperframes composition: the entire poker table, rendered fresh from one
      JSON query param on every state change. The server sends the FULL state
      each time and `reveal` names which cards are new — those animate in, the
      rest render statically, so replacing the src is idempotent.

      The GSAP timeline is created PAUSED and registered on window.__timelines;
      <hyperframes-player> drives it. Content comes from the query string
      rather than postMessage: the player hosts this page in a sandboxed
      iframe, and reading location.search sidesteps every parent/child
      handshake race. Unlike the ephemeral card overlays this replaced, the
      timeline is hours long — the table persists until the next state replaces
      it; it never plays itself out.
    -->
    <!--
      GSAP is vendored locally, not pulled from a CDN. The player probes the
      iframe for window.__timelines and, if it hasn't appeared after a few
      attempts, falls back to a degraded path — a slow external script fetch is
      enough to trip that, so the timeline must register synchronously on first
      load. A local file guarantees it.
    -->
    <script src="./vendor/gsap.min.js"></script>
    <style>
      /* ── THEMES ─────────────────────────────────────────────────────────────
         Every color in the composition reads a custom property; a theme is one
         block of overrides. Pick the theme by hardcoding data-theme on <body>
         below — it is part of this file, not a tool argument.

           (none) / "midnight"  the original look: transparent background, the
                                avatar's stage shows through
           "velvet"             Theme 1 · High-Stakes Velvet — crimson felt,
                                ivory cards, metallic gold, forest backs
           "monte-carlo"        Theme 2 · Monte Carlo Royal — midnight-navy
                                felt, silver-trimmed white cards, vintage
                                royal-red backs, muted brass
           "lounge"             Theme 3 · The Private Lounge — monochrome &
                                burgundy: matte-charcoal felt, espresso backs,
                                casino-red rail, scarlet glow accents

         :root carries the midnight defaults; theme blocks override. */
      :root {
        --felt: transparent;
        --felt-inset: none;
        --card-face: linear-gradient(160deg, #ffffff, #e9edf4);
        --card-ink: #1c2430;
        --card-red: #d4353f;
        --card-border: rgba(0, 0, 0, 0.35);
        --card-back: repeating-linear-gradient(
            45deg,
            rgba(255, 255, 255, 0.07) 0 10px,
            transparent 10px 20px
          ),
          linear-gradient(160deg, #23305a, #131a36);
        --card-back-border: rgba(255, 255, 255, 0.2);
        --card-back-inner: rgba(255, 255, 255, 0.22);
        --slot-bg: rgba(10, 14, 26, 0.35);
        --slot-border: rgba(255, 255, 255, 0.22);
        --chip-bg: rgba(10, 14, 24, 0.78);
        --chip-border: rgba(255, 255, 255, 0.16);
        --text-main: #e8ecf4;
        --text-dim: #9fb2cc;
        --pot-color: #ffd98a;
        --pot-glow: none;
        --status-bg: rgba(10, 14, 24, 0.72);
        --status-border: rgba(255, 255, 255, 0.14);
        --status-color: #dfe6f2;
        --call-bg: rgba(214, 96, 56, 0.24);
        --call-border: rgba(255, 156, 108, 0.55);
        --call-color: #ffc9a8;
        --score-up: #6fe0a8;
        --score-down: #ff9d9d;
      }
      body[data-theme="velvet"] {
        --felt: radial-gradient(120% 95% at 50% 32%, #7f1523 0%, #6b0f1a 48%, #45080f 100%);
        /* Gold rail + vignette painted over the felt (under the pieces). */
        --felt-inset:
          inset 0 0 0 4px rgba(212, 175, 55, 0.28),
          inset 0 0 12px 6px rgba(0, 0, 0, 0.35),
          inset 0 0 220px rgba(0, 0, 0, 0.5);
        --card-face: linear-gradient(160deg, #fdfbf4, #efeadb);
        --card-ink: #111111;
        --card-red: #b5202c;
        --card-border: rgba(212, 175, 55, 0.55);
        /* Harlequin diamonds: a 4-slice conic from 45° tiles as a diamond
           checker, gold over the forest velvet. */
        --card-back: repeating-conic-gradient(
              from 45deg,
              rgba(212, 175, 55, 0.12) 0 25%,
              transparent 0 50%
            )
            0 0 / 36px 36px,
          linear-gradient(160deg, #1e3a2b, #10231a);
        --card-back-border: rgba(212, 175, 55, 0.45);
        --card-back-inner: rgba(212, 175, 55, 0.4);
        --slot-bg: rgba(0, 0, 0, 0.25);
        --slot-border: rgba(212, 175, 55, 0.35);
        --chip-bg: rgba(17, 17, 17, 0.82);
        --chip-border: rgba(212, 175, 55, 0.4);
        --text-main: #f5f5f0;
        --text-dim: #cfc9b8;
        --pot-color: #d4af37;
        --status-bg: rgba(17, 17, 17, 0.78);
        --status-border: rgba(212, 175, 55, 0.35);
        --status-color: #f5f5f0;
        --call-bg: rgba(212, 175, 55, 0.18);
        --call-border: rgba(212, 175, 55, 0.6);
        --call-color: #ffe9ab;
        --score-up: #8fdcae;
        --score-down: #ff9d9d;
      }
      body[data-theme="monte-carlo"] {
        --felt: radial-gradient(120% 95% at 50% 32%, #1a2440 0%, #0f172a 52%, #090e1c 100%);
        /* Brass rail + vignette. */
        --felt-inset:
          inset 0 0 0 4px rgba(197, 160, 89, 0.32),
          inset 0 0 12px 6px rgba(0, 0, 0, 0.35),
          inset 0 0 220px rgba(0, 0, 0, 0.5);
        --card-face: linear-gradient(160deg, #ffffff, #e9eef6);
        --card-ink: #0f172a;
        --card-red: #8b0000;
        --card-border: rgba(226, 232, 240, 0.85);
        /* Vintage deck back: royal red with a silver-white lattice. */
        --card-back: repeating-linear-gradient(
            45deg,
            rgba(226, 232, 240, 0.14) 0 8px,
            transparent 8px 16px
          ),
          repeating-linear-gradient(
            -45deg,
            rgba(226, 232, 240, 0.1) 0 8px,
            transparent 8px 16px
          ),
          linear-gradient(160deg, #8b0000, #560000);
        --card-back-border: rgba(226, 232, 240, 0.55);
        --card-back-inner: rgba(226, 232, 240, 0.5);
        --slot-bg: rgba(226, 232, 240, 0.06);
        --slot-border: rgba(226, 232, 240, 0.3);
        --chip-bg: rgba(15, 23, 42, 0.82);
        --chip-border: rgba(197, 160, 89, 0.45);
        --text-main: #ffffff;
        --text-dim: #b6c2d6;
        --pot-color: #c5a059;
        --status-bg: rgba(15, 23, 42, 0.8);
        --status-border: rgba(197, 160, 89, 0.4);
        --status-color: #ffffff;
        --call-bg: rgba(139, 0, 0, 0.45);
        --call-border: rgba(226, 232, 240, 0.55);
        --call-color: #ffffff;
        --score-up: #6fe0a8;
        --score-down: #ff9d9d;
      }
      body[data-theme="lounge"] {
        --felt: radial-gradient(120% 95% at 50% 32%, #1d1d1d 0%, #141414 55%, #0b0b0b 100%);
        /* Casino-red rail with a soft scarlet glow bleeding inward. */
        --felt-inset:
          inset 0 0 0 3px rgba(166, 25, 46, 0.55),
          inset 0 0 34px rgba(255, 59, 86, 0.12),
          inset 0 0 220px rgba(0, 0, 0, 0.6);
        --card-face: linear-gradient(160deg, #ffffff, #e9e9e9);
        --card-ink: #141414;
        --card-red: #a6192e;
        --card-border: rgba(0, 0, 0, 0.45);
        /* Warm dark espresso with fine platinum pinstripes, red-trimmed. */
        --card-back: repeating-linear-gradient(
            90deg,
            rgba(229, 229, 229, 0.05) 0 2px,
            transparent 2px 14px
          ),
          linear-gradient(160deg, #241d1e, #171314);
        --card-back-border: rgba(255, 59, 86, 0.35);
        --card-back-inner: rgba(166, 25, 46, 0.6);
        --slot-bg: rgba(255, 255, 255, 0.03);
        --slot-border: rgba(229, 229, 229, 0.18);
        --chip-bg: rgba(31, 26, 27, 0.85);
        --chip-border: rgba(229, 229, 229, 0.14);
        --text-main: #e5e5e5;
        --text-dim: #9a9a9a;
        --pot-color: #ff3b56;
        --pot-glow: 0 0 18px rgba(255, 59, 86, 0.45);
        --status-bg: rgba(31, 26, 27, 0.82);
        --status-border: rgba(166, 25, 46, 0.45);
        --status-color: #e5e5e5;
        --call-bg: rgba(166, 25, 46, 0.32);
        --call-border: rgba(255, 59, 86, 0.6);
        --call-color: #ffb9c2;
        --score-up: #7fd9a5;
        --score-down: #ff6b7e;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        /* Midnight: transparent, the avatar's WebRTC video shows through.
           Opaque felt themes still work — the PiP video stacks ABOVE this
           overlay (z-index 3 vs 2 in web/index.html), so the avatar is never
           covered. color-scheme MUST match the host page's (dark,
           web/index.html): Chrome paints an opaque base behind an iframe whose
           used color scheme differs from its embedder's, so a composition on
           the default scheme renders as a white sheet over the avatar no
           matter how transparent its background is. */
        color-scheme: dark;
        background: var(--felt);
        font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      /* Rail/vignette layer for felt themes; none under midnight. Sits under
         every table region (they are later siblings, so they paint above). */
      #root::before {
        content: "";
        position: absolute;
        inset: 0;
        box-shadow: var(--felt-inset);
        pointer-events: none;
      }
      /* ── cards ─────────────────────────────────────────────────────────────
         One renderer covers all 52 variants: rank + suit from the code string.
         Two sizes: board/opponent (regular) and the player's hand (large). The
         bottom-RIGHT quadrant stays clear — that is where the avatar sits. */
      .card {
        position: relative;
        width: 158px;
        height: 222px;
        border-radius: 14px;
        background: var(--card-face);
        border: 1px solid var(--card-border);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        color: var(--card-ink);
        flex: none;
      }
      .card.big {
        width: 196px;
        height: 274px;
        border-radius: 16px;
      }
      .card.red {
        color: var(--card-red);
      }
      .card .corner {
        position: absolute;
        top: 10px;
        left: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 0.95;
        font-weight: 800;
        font-size: 40px;
      }
      .card.big .corner {
        font-size: 50px;
      }
      .card .corner .suit {
        font-size: 32px;
      }
      .card.big .corner .suit {
        font-size: 40px;
      }
      .card .pip {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 96px;
        padding-top: 22px;
      }
      .card.big .pip {
        font-size: 120px;
      }
      .card.back {
        background: var(--card-back);
        border-color: var(--card-back-border);
      }
      .card.back::after {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 9px;
        border: 1.5px solid var(--card-back-inner);
      }
      .card.slot {
        background: var(--slot-bg);
        border: 2px dashed var(--slot-border);
        box-shadow: none;
      }
      /* ── table regions ──────────────────────────────────────────────────── */
      .hand {
        position: absolute;
        display: flex;
        gap: 18px;
      }
      #opp-hand {
        top: 96px;
        right: 96px;
      }
      #player-hand {
        left: 96px;
        bottom: 104px;
      }
      #board {
        position: absolute;
        top: 360px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 26px;
      }
      .label {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 20px;
        border-radius: 999px;
        background: var(--chip-bg);
        border: 1px solid var(--chip-border);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: 26px;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .label .stack {
        font-weight: 600;
        color: var(--text-dim);
      }
      #opp-label {
        top: 340px;
        right: 96px;
      }
      #player-label {
        left: 96px;
        bottom: 402px;
      }
      #to-call {
        left: 546px;
        bottom: 200px;
        background: var(--call-bg);
        border-color: var(--call-border);
        color: var(--call-color);
      }
      #pot {
        position: absolute;
        top: 282px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 26px;
        border-radius: 999px;
        background: var(--chip-bg);
        border: 1px solid var(--chip-border);
        font-size: 28px;
        font-weight: 800;
        color: var(--pot-color);
        text-shadow: var(--pot-glow);
        letter-spacing: 0.04em;
      }
      #status {
        position: absolute;
        top: 620px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 900px;
        padding: 12px 30px;
        border-radius: 14px;
        background: var(--status-bg);
        border: 1px solid var(--status-border);
        font-size: 30px;
        font-weight: 600;
        color: var(--status-color);
        text-align: center;
      }
      #meta {
        position: absolute;
        top: 42px;
        left: 96px;
        display: flex;
        gap: 14px;
        font-size: 24px;
        font-weight: 700;
      }
      #meta span {
        padding: 8px 18px;
        border-radius: 999px;
        background: var(--chip-bg);
        border: 1px solid var(--chip-border);
        color: var(--text-dim);
      }
      #meta #score.up {
        color: var(--score-up);
      }
      #meta #score.down {
        color: var(--score-down);
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <!-- THEME DEFAULT (hardcoded): "midnight" | "velvet" | "monte-carlo" |
       "lounge" — see the theme blocks at the top of <style>. In the app the
       stage's theme selector overrides this via the ?theme query param
       (pokerTable.ts); this attribute applies when the file is opened
       directly. -->
  <body data-theme="monte-carlo">
    <div id="root" data-composition-id="poker-table" data-start="0" data-duration="3600" data-width="1920" data-height="1080">
      <div id="meta">
        <span id="hand-no"></span>
        <span id="score"></span>
      </div>
      <div id="opp-hand" class="hand"></div>
      <div id="opp-label" class="label">Opponent <span class="stack"></span></div>
      <div id="pot"></div>
      <div id="board"></div>
      <div id="status"></div>
      <div id="player-hand" class="hand"></div>
      <div id="player-label" class="label">You <span class="stack"></span></div>
      <div id="to-call" class="label"></div>
    </div>

    <script>
      const COMPOSITION_ID = "poker-table";
      const DURATION = 3600; // the table persists; it never plays itself out

      const SUIT_GLYPH = { s: "♠", h: "♥", d: "♦", c: "♣" };
      const CARD_RE = /^[2-9TJQKA][shdc]$/;

      // State from the query string, parsed defensively — a malformed payload
      // renders an empty table rather than throwing before the timeline
      // registers (the player's probe must always find it).
      let state = {};
      try {
        state = JSON.parse(new URLSearchParams(location.search).get("state") || "{}") || {};
      } catch {
        state = {};
      }
      // Theme override from the client (pokerTable.ts sends the selector's
      // choice). The hardcoded <body data-theme> only applies when this file
      // is opened directly. An unknown value matches no theme block and falls
      // back to the :root (midnight) tokens.
      const themeParam = new URLSearchParams(location.search).get("theme");
      if (themeParam) document.body.dataset.theme = themeParam;
      const reveal = typeof state.reveal === "string" ? state.reveal : "update";
      const cards = (v, n) =>
        (Array.isArray(v) ? v : []).filter((c) => typeof c === "string" && CARD_RE.test(c)).slice(0, n);
      const num = (v) => (typeof v === "number" && isFinite(v) ? v : 0);

      const playerHand = cards(state.playerHand, 2);
      const board = cards(state.board, 5);
      const oppHand = cards(state.opponentHand, 2);

      // One renderer, all 52 variants. textContent only — nothing here may
      // become markup, and the status line originates upstream.
      function cardEl(code, big) {
        const el = document.createElement("div");
        el.className = "card" + (big ? " big" : "");
        const rank = code[0] === "T" ? "10" : code[0];
        const suit = code[1];
        if (suit === "h" || suit === "d") el.classList.add("red");
        const corner = document.createElement("div");
        corner.className = "corner";
        const r = document.createElement("div");
        r.textContent = rank;
        const s = document.createElement("div");
        s.className = "suit";
        s.textContent = SUIT_GLYPH[suit];
        corner.append(r, s);
        const pip = document.createElement("div");
        pip.className = "pip";
        pip.textContent = SUIT_GLYPH[suit];
        el.append(corner, pip);
        return el;
      }
      const backEl = (big) => {
        const el = document.createElement("div");
        el.className = "card back" + (big ? " big" : "");
        return el;
      };
      const slotEl = () => {
        const el = document.createElement("div");
        el.className = "card slot";
        return el;
      };
      const mark = (el) => (el.classList.add("anim"), el);

      // ── build the table; `anim` marks what this update animates ───────────
      const playerHandEl = document.getElementById("player-hand");
      for (const c of playerHand) {
        const el = cardEl(c, true);
        playerHandEl.append(reveal === "new_hand" ? mark(el) : el);
      }

      const oppHandEl = document.getElementById("opp-hand");
      if (oppHand.length === 2) {
        for (const c of oppHand) oppHandEl.append(reveal === "opponent" ? mark(cardEl(c)) : cardEl(c));
      } else {
        for (let i = 0; i < 2; i++) {
          const el = backEl();
          oppHandEl.append(reveal === "new_hand" ? mark(el) : el);
        }
      }

      // Which board indexes are new: flop → 0-2, turn → 3, river → 4. On an
      // all-in runout the reveal is "opponent" while several cards appear at
      // once — animate any card past the count the reveal implies is old.
      const newFrom = { flop: 0, turn: 3, river: 4 }[reveal];
      const boardEl = document.getElementById("board");
      for (let i = 0; i < 5; i++) {
        const code = board[i];
        if (!code) {
          const el = slotEl();
          boardEl.append(reveal === "new_hand" ? mark(el) : el);
        } else {
          const el = cardEl(code);
          boardEl.append(newFrom !== undefined && i >= newFrom ? mark(el) : el);
        }
      }

      // ── text fields ────────────────────────────────────────────────────────
      const setText = (id, text) => (document.getElementById(id).textContent = text);
      const bb = (n) => `${num(n)}bb`;
      setText("hand-no", `Hand #${num(state.handNumber)}`);
      const score = num(state.scoreBb);
      const scoreEl = document.getElementById("score");
      scoreEl.textContent = `${score >= 0 ? "+" : ""}${score}bb`;
      scoreEl.classList.add(score >= 0 ? "up" : "down");
      setText("pot", `POT ${bb(state.potBb)}`);
      document.querySelector("#player-label .stack").textContent = bb(state.playerStackBb);
      document.querySelector("#opp-label .stack").textContent = bb(state.opponentStackBb);
      const status = typeof state.statusText === "string" ? state.statusText.slice(0, 120) : "";
      setText("status", status);
      if (!status) document.getElementById("status").classList.add("hidden");
      const toCall = num(state.toCallBb);
      if (toCall > 0) setText("to-call", `${bb(toCall)} to call`);
      else document.getElementById("to-call").classList.add("hidden");

      // ── timeline: flip the new cards in, pulse the status, then hold ──────
      const tl = gsap.timeline({ paused: true });
      const anim = document.querySelectorAll(".anim");
      if (reveal === "new_hand") {
        tl.from("#root", { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);
      }
      if (anim.length > 0) {
        tl.from(
          anim,
          { rotateY: 90, opacity: 0, y: 14, duration: 0.45, stagger: 0.14, ease: "power2.out" },
          reveal === "new_hand" ? 0.2 : 0,
        );
      }
      if (status) {
        tl.from("#status", { opacity: 0, y: 10, duration: 0.35, ease: "power2.out" }, anim.length ? 0.25 : 0);
      }
      // Pin the timeline length to data-duration: a final no-op keeps the
      // player holding the last frame for the table's whole life.
      tl.to("#root", { opacity: 1, duration: 0.01 }, DURATION - 0.01);

      // Registered synchronously — nothing async may run before this line, or
      // the player's probe misses it.
      window.__timelines = window.__timelines || {};
      window.__timelines[COMPOSITION_ID] = tl;
    </script>
  </body>
</html>
