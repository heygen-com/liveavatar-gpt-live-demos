<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>LiveAvatar × GPT-Live</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2333d1ff'/><stop offset='1' stop-color='%2300c3ff'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='%23ffffff' stroke='%23e3e6e9' stroke-width='2'/><circle cx='32' cy='32' r='15' fill='url(%23g)'/><circle cx='32' cy='32' r='23' fill='none' stroke='url(%23g)' stroke-opacity='.4' stroke-width='3'/></svg>"
    />
    <style>
      :root {
        /* Light theme on liveavatar.com's tokens. color-scheme MUST match the
           overlay compositions (web/public/overlays/*.html) — a mismatch makes
           Chrome paint an opaque canvas behind the player iframe. */
        color-scheme: light;
        --bg: #f7f8fa; /* --surface-page */
        --surface: #ffffff;
        --chip: #f2f4f6;
        --edge: #e3e6e9;
        --ink: #0e404f; /* eden */
        --ink-deep: #0f2c3f;
        --secondary: #6b7280;
        --muted: #818999;
        --accent: #00c3ff;
        --accent-2: #33d1ff;
        --glow: 0, 195, 255;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 28px 16px;
      }
      header {
        width: min(1280px, 100%);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .mark {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin: 0;
        color: var(--muted);
      }
      /* ── Layout ─────────────────────────────────────────────────────────────
         Stage on the left with the control bar directly under it; the
         transcript is a full-height panel on the right spanning both rows.
         The stage's 16:9 aspect sets the row heights, so the panel scrolls
         internally instead of stretching the grid (its content is absolutely
         positioned inside for exactly that reason). */
      #layout {
        width: min(1280px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        grid-template-areas:
          "stage transcript"
          "controls transcript";
        gap: 16px;
      }
      /* ── The stage ──────────────────────────────────────────────────────────
         The avatar's video with the overlay stacked transparently on top, plus
         the pre-session hero and the connecting loader — all layered in one
         box, switched by data-state (idle | connecting | live).

         Staging is per-widget and decided by the client (overlays/index.ts) —
         never by the model: the pricing sheet sets data-pip, which shrinks the
         avatar to the bottom-right corner while the panel holds the stage. */
      #stage {
        grid-area: stage;
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        overflow: hidden;
        /* Site hero treatment: soft cyan glow on the page tone. */
        background: radial-gradient(circle at 50% 30%, rgba(var(--glow), 0.22) 0%, transparent 42%), var(--surface);
        border: 1px solid var(--edge);
      }
      #stage video {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--ink-deep);
        object-fit: contain;
        z-index: 1;
        /* Hidden until the first frame ("playing" → data-state=live) so the
           join reads as a fade-in, not a black box that suddenly has a person
           in it. Inset/size animated so the PiP shrink reads as a move. */
        opacity: 0;
        transition:
          opacity 0.5s ease,
          inset 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          border-radius 0.4s ease;
      }
      #stage[data-state="live"] video {
        opacity: 1;
      }
      #stage[data-pip] video {
        /* Lengths only — an `auto` inset can't interpolate, which snaps the
           video to the top-left on the way back to full-frame. The stage is
           16/9, so 28% of its height matches 28% of its width. */
        top: calc(72% - 16px);
        left: calc(72% - 16px);
        width: 28%;
        height: 28%;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(15, 44, 63, 0.35);
        z-index: 4;
      }
      /* The resting frame: a persistent Hyperframes composition (overlays/home.html)
         — "Ask me anything" banner + prompt chips — that plays over the
         full-frame avatar whenever no card is up. main.ts gives it a src on
         the first video frame and drops it on stop; overlays/index.ts stamps
         data-card on the stage while a widget holds the screen, which fades
         this layer out so it never sits behind a panel. */
      #home-player {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        border: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      #stage[data-state="live"]:not([data-card]) #home-player {
        opacity: 1;
      }
      /* The overlay: a transparent iframe (hyperframes-player) stacked over the
         avatar's WebRTC video. The stream itself is untouched — nothing is
         composited into it. pointer-events off so it never swallows clicks. */
      #overlay-player {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        border: 0;
        z-index: 3;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      #overlay-player.visible {
        opacity: 1;
      }
      /* Speaking glow: a ring the analyser in main.ts lights while the avatar's
         audio is above the noise floor. Sits over video+overlay, under hero. */
      #stage::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 12px;
        pointer-events: none;
        z-index: 5;
        box-shadow:
          inset 0 0 0 1.5px rgba(var(--glow), 0),
          0 0 46px rgba(var(--glow), 0);
        transition: box-shadow 0.35s ease;
      }
      #stage[data-speaking]::after {
        box-shadow:
          inset 0 0 0 1.5px rgba(var(--glow), 0.5),
          0 0 46px rgba(var(--glow), 0.22);
      }
      /* ── The support hand-off card ───────────────────────────────────────
         The one visual that is NOT a Hyperframes composition: it has to be
         clickable, and the player's iframe is sandboxed with no popups or
         top-level navigation (so a mailto: inside it is inert) and is
         pointer-events: none anyway. Built as real DOM by
         web/src/overlays/supportContact.ts and appended here.

         z-index 4: above the video and both players, below the speaking
         glow and the hero. Lower-left, so the avatar's face stays clear —
         this card runs WITHOUT PiP. */
      /* Light card on liveavatar.com tokens (page #F7F8FA · cyan #00C3FF ·
         eden #0E404F · muted #818999 · edge #E3E6E9), matching the overlays. */
      #support-card {
        position: absolute;
        left: 4%;
        bottom: 6%;
        z-index: 4;
        width: min(400px, 84%);
        box-sizing: border-box;
        display: block;
        padding: 18px 20px 20px;
        border-radius: 14px;
        text-decoration: none;
        color: #0e404f;
        background: radial-gradient(circle at 18% 0%, rgba(0, 195, 255, 0.22) 0%, transparent 42%), #f7f8fa;
        border: 1px solid #e3e6e9;
        box-shadow: 0 18px 50px rgba(15, 44, 63, 0.45);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease,
          border-color 0.2s ease;
      }
      #support-card.visible {
        opacity: 1;
        transform: translateY(0);
      }
      #support-card:hover,
      #support-card:focus-visible {
        border-color: #00c3ff;
      }
      #support-card .sc-title {
        font-size: 15px;
        font-weight: 700;
        color: #0e404f;
        padding-right: 22px; /* clears the dismiss button */
      }
      #support-card .sc-note {
        margin-top: 5px;
        font-size: 12.5px;
        line-height: 1.45;
        color: #818999;
      }
      /* The address reads as the CTA, last in the card: the whole card is
         the mailto link. */
      #support-card .sc-email {
        display: inline-block;
        margin-top: 14px;
        padding: 8px 14px;
        border-radius: 999px;
        background: #00c3ff;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        word-break: break-all;
        transition: background 0.2s ease;
      }
      #support-card:hover .sc-email {
        background: #00a9de;
      }
      #support-card .sc-subject {
        margin-top: 12px;
        font-size: 12px;
        font-weight: 600;
        color: #0e404f;
      }
      /* The user's own words, echoed back so they can see the draft is theirs.
         Clamped: a long ask must not grow the card off the stage. */
      #support-card .sc-preview {
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.5;
        color: #818999;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      #support-card .sc-dismiss {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: #f2f4f6;
        color: #818999;
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
      }
      #support-card .sc-dismiss:hover {
        background: #dff8ff;
        color: #0e404f;
      }
      /* ── In-stage states: hero (idle) and loader (connecting) ───────────── */
      #hero,
      #loader {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 14px;
        padding: 0 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      #stage[data-state="idle"] #hero {
        opacity: 1;
        pointer-events: auto;
      }
      #stage[data-state="connecting"] #loader {
        opacity: 1;
      }
      #hero h2 {
        margin: 0;
        font-size: clamp(22px, 4vw, 34px);
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      #hero p {
        margin: 0;
        max-width: 60ch;
        font-size: 15px;
        line-height: 1.55;
        color: var(--secondary);
      }
      #hero .hint {
        font-size: 12px;
        color: var(--muted);
      }
      #start {
        margin-top: 6px;
        /* Site CTA: solid cyan, eden ink. */
        background: var(--accent);
        color: var(--ink);
        border: 0;
        border-radius: 999px;
        padding: 14px 36px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 30px rgba(var(--glow), 0.35);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      #start:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 10px 36px rgba(var(--glow), 0.45);
      }
      #start:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .orb {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 40px rgba(var(--glow), 0.4);
        animation: breathe 1.6s ease-in-out infinite;
      }
      #loader-label {
        font-size: 13px;
        color: var(--muted);
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(0.85);
          opacity: 0.7;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      /* ── Controls: avatar-state pill · mic (mute + waveform) · end call ──── */
      #controls {
        grid-area: controls;
        min-height: 48px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 14px;
      }
      #status {
        justify-self: start;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      #status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #b9c0c7;
        transition: background 0.2s ease;
      }
      #status[data-kind="busy"]::before {
        background: #f5b453;
        animation: pulse 1.2s ease-in-out infinite;
      }
      #status[data-kind="live"]::before {
        background: var(--accent);
      }
      #status[data-kind="error"]::before {
        background: #d92d20;
      }
      #status[data-kind="error"] {
        color: #b42318;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      /* The mic button carries its own liveness: frequency bars from the mic
         signal (an AnalyserNode tapping the same source the worklet ships,
         drawn by uiTick in main.ts), so "the avatar hears me" is visible on
         the control itself. Click = mute: the track is disabled but silence
         keeps streaming (see micCapture) — the bars drop to stubs. */
      #mic {
        justify-self: center;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid var(--edge);
        background: var(--surface);
        color: var(--ink);
        font-size: 13px;
        cursor: pointer;
        transition:
          border-color 0.2s ease,
          background 0.2s ease,
          color 0.2s ease;
      }
      #mic:hover:not(:disabled) {
        background: var(--chip);
      }
      #mic:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #mic .wave {
        /* Canvas backing store is 2x for retina; CSS pins the drawn size. */
        display: block;
        width: 40px;
        height: 22px;
      }
      #mic[data-muted] {
        color: #b42318;
        border-color: rgba(217, 45, 32, 0.35);
        background: rgba(217, 45, 32, 0.08);
      }
      #mic[data-muted] .wave {
        opacity: 0.5;
      }
      #mic .icon-off {
        display: none;
      }
      #mic[data-muted] .icon-on {
        display: none;
      }
      #mic[data-muted] .icon-off {
        display: block;
      }
      #stop {
        justify-self: end;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(217, 45, 32, 0.08);
        color: #b42318;
        border: 1px solid rgba(217, 45, 32, 0.35);
        border-radius: 999px;
        padding: 10px 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      #stop:hover:not(:disabled) {
        background: rgba(217, 45, 32, 0.16);
      }
      #stop:disabled {
        opacity: 0.35;
        cursor: default;
      }
      /* ── Transcript: side panel, one row per turn, streaming rewrites ────── */
      #transcript-panel {
        grid-area: transcript;
        position: relative;
        border: 1px solid var(--edge);
        border-radius: 12px;
        background: var(--surface);
        overflow: hidden;
        min-height: 0;
      }
      #transcript-panel .panel-inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      #transcript-panel h2 {
        margin: 0;
        padding: 12px 14px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--edge);
      }
      #transcript {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 14px;
        line-height: 1.45;
        padding: 12px;
      }
      #transcript:empty::before {
        content: "The conversation appears here as you talk.";
        margin: auto;
        padding: 0 18px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }
      .turn {
        display: flex;
        flex-direction: column;
        max-width: 92%;
        animation: rise 0.25s ease both;
      }
      .turn .who {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 4px 3px;
      }
      .turn .text {
        padding: 8px 12px;
        border-radius: 12px;
      }
      .turn.user {
        align-self: flex-end;
        align-items: flex-end;
      }
      .turn.user .text {
        background: #dff8ff; /* --c-pale */
        border: 1px solid #aaebff; /* --c-sky */
        color: var(--ink);
        border-bottom-right-radius: 4px;
      }
      .turn.assistant {
        align-self: flex-start;
      }
      .turn.assistant .text {
        background: var(--chip);
        border: 1px solid var(--edge);
        color: var(--ink);
        border-bottom-left-radius: 4px;
      }
      .turn.interrupted .text {
        opacity: 0.55;
        text-decoration: line-through;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 900px) {
        #layout {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas:
            "stage"
            "controls"
            "transcript";
        }
        #transcript-panel {
          position: static;
          height: 280px;
        }
        #transcript-panel .panel-inner {
          position: static;
          height: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .orb,
        #status::before,
        .turn {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true"></span>
      <h1>LiveAvatar × GPT-Live</h1>
    </header>
    <div id="layout">
      <div id="stage" data-state="idle">
        <video id="video" autoplay playsinline></video>
        <audio id="audio" autoplay></audio>
        <hyperframes-player id="home-player" autoplay muted loop></hyperframes-player>
        <hyperframes-player id="overlay-player" autoplay muted></hyperframes-player>
        <div id="hero">
          <h2>Ask us anything about LiveAvatar</h2>
          <p>
            Using full-duplex speech from GPT-Live and LiveAvatar + HyperFrames
            for visuals, get answers about LiveAvatar — features, integrations,
            and pricing.
          </p>
          <button id="start">Start talking</button>
          <span class="hint">Uses your microphone</span>
        </div>
        <div id="loader" aria-hidden="true">
          <span class="orb"></span>
          <span id="loader-label">starting session…</span>
        </div>
      </div>
      <div id="controls">
        <div id="status" data-kind="idle">idle</div>
        <button id="mic" disabled aria-pressed="false" title="Mute microphone" aria-label="Mute microphone">
          <svg class="icon-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4" />
          </svg>
          <svg class="icon-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4" />
            <line x1="4" y1="3" x2="20" y2="21" />
          </svg>
          <canvas class="wave" width="80" height="44" aria-hidden="true"></canvas>
        </button>
        <button id="stop" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
              transform="rotate(135 12 12)"
            />
          </svg>
          End call
        </button>
      </div>
      <aside id="transcript-panel" aria-label="transcript">
        <div class="panel-inner">
          <h2>Transcript</h2>
          <div id="transcript"></div>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
