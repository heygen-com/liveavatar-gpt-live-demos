<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <title>LiveAvatar × GPT-Live</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236ea8ff'/><stop offset='1' stop-color='%23b98cff'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='%230b0d12'/><circle cx='32' cy='32' r='15' fill='url(%23g)'/><circle cx='32' cy='32' r='23' fill='none' stroke='url(%23g)' stroke-opacity='.4' stroke-width='3'/></svg>"
    />
    <style>
      :root {
        color-scheme: dark;
        /* Palette matches the overlay compositions (term-card.html): a
           blue→violet accent over deep navy glass. */
        --bg: #0b0d12;
        --ink: #e8ecf4;
        --muted: #8b98ad;
        --accent: #6ea8ff;
        --accent-2: #b98cff;
        --glow: 110, 168, 255;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 28px 16px;
      }
      header {
        width: min(1280px, 100%);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .mark {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin: 0;
        color: #aab6c8;
      }
      /* ── Layout ─────────────────────────────────────────────────────────────
         Stage on the left with the control bar directly under it; the
         transcript is a full-height panel on the right spanning both rows.
         The stage's 16:9 aspect sets the row heights, so the panel scrolls
         internally instead of stretching the grid (its content is absolutely
         positioned inside for exactly that reason). */
      #layout {
        width: min(1280px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        grid-template-areas:
          "stage transcript"
          "controls transcript";
        gap: 16px;
      }
      /* ── The stage ──────────────────────────────────────────────────────────
         The avatar's video with the overlay stacked transparently on top, plus
         the pre-session hero and the connecting loader — all layered in one
         box, switched by data-state (idle | connecting | live).

         Staging is per-widget and decided by the client (overlays/index.ts) —
         never by the model: a term card leaves the avatar full-frame; the
         learned-words recap sets data-pip, which shrinks the avatar to the
         bottom-right corner while the panel holds the stage. */
      #stage {
        grid-area: stage;
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 0%, #141a2a 0%, #0a0c11 65%);
      }
      #stage video {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
        object-fit: contain;
        z-index: 1;
        /* Hidden until the first frame ("playing" → data-state=live) so the
           join reads as a fade-in, not a black box that suddenly has a person
           in it. Inset/size animated so the PiP shrink reads as a move. */
        opacity: 0;
        transition:
          opacity 0.5s ease,
          inset 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          border-radius 0.4s ease;
      }
      #stage[data-state="live"] video {
        opacity: 1;
      }
      #stage[data-pip] video {
        /* Lengths only — an `auto` inset can't interpolate, which snaps the
           video to the top-left on the way back to full-frame. The stage is
           16/9, so 28% of its height matches 28% of its width. */
        top: calc(72% - 16px);
        left: calc(72% - 16px);
        width: 28%;
        height: 28%;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        z-index: 3;
      }
      /* The overlay: a transparent iframe (hyperframes-player) stacked over the
         avatar's WebRTC video. The stream itself is untouched — nothing is
         composited into it. pointer-events off so it never swallows clicks. */
      #overlay-player {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        border: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      #overlay-player.visible {
        opacity: 1;
      }
      /* Speaking glow: a ring the analyser in main.ts lights while the avatar's
         audio is above the noise floor. Sits over video+overlay, under hero. */
      #stage::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 12px;
        pointer-events: none;
        z-index: 4;
        box-shadow:
          inset 0 0 0 1.5px rgba(var(--glow), 0),
          0 0 46px rgba(var(--glow), 0);
        transition: box-shadow 0.35s ease;
      }
      #stage[data-speaking]::after {
        box-shadow:
          inset 0 0 0 1.5px rgba(var(--glow), 0.5),
          0 0 46px rgba(var(--glow), 0.22);
      }
      /* ── In-stage states: hero (idle) and loader (connecting) ───────────── */
      #hero,
      #loader {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 14px;
        padding: 0 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      #stage[data-state="idle"] #hero {
        opacity: 1;
        pointer-events: auto;
      }
      #stage[data-state="connecting"] #loader {
        opacity: 1;
      }
      #hero h2 {
        margin: 0;
        font-size: clamp(22px, 4vw, 34px);
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #fff;
      }
      #hero p {
        margin: 0;
        max-width: 60ch;
        font-size: 15px;
        line-height: 1.55;
        color: var(--muted);
      }
      #hero .hint {
        font-size: 12px;
        color: #5f6b80;
      }
      #start {
        margin-top: 6px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #0b0d12;
        border: 0;
        border-radius: 999px;
        padding: 14px 36px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 30px rgba(var(--glow), 0.35);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      #start:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 10px 36px rgba(var(--glow), 0.45);
      }
      #start:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .orb {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 40px rgba(var(--glow), 0.4);
        animation: breathe 1.6s ease-in-out infinite;
      }
      #loader-label {
        font-size: 13px;
        color: var(--muted);
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(0.85);
          opacity: 0.7;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      /* ── Controls: avatar-state pill · mic (mute + waveform) · end call ──── */
      #controls {
        grid-area: controls;
        min-height: 48px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 14px;
      }
      #status {
        justify-self: start;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      #status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #5a6577;
        transition: background 0.2s ease;
      }
      #status[data-kind="busy"]::before {
        background: #f5b453;
        animation: pulse 1.2s ease-in-out infinite;
      }
      #status[data-kind="live"]::before {
        background: #59d499;
      }
      #status[data-kind="error"]::before {
        background: #ff7a7a;
      }
      #status[data-kind="error"] {
        color: #ffa3a3;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      /* The mic button carries its own liveness: frequency bars from the mic
         signal (an AnalyserNode tapping the same source the worklet ships,
         drawn by uiTick in main.ts), so "the avatar hears me" is visible on
         the control itself. Click = mute: the track is disabled but silence
         keeps streaming (see micCapture) — the bars drop to stubs. */
      #mic {
        justify-self: center;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        font-size: 13px;
        cursor: pointer;
        transition:
          border-color 0.2s ease,
          background 0.2s ease,
          color 0.2s ease;
      }
      #mic:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
      }
      #mic:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #mic .wave {
        /* Canvas backing store is 2x for retina; CSS pins the drawn size. */
        display: block;
        width: 40px;
        height: 22px;
      }
      #mic[data-muted] {
        color: #ff9d9d;
        border-color: rgba(255, 122, 122, 0.35);
        background: rgba(255, 90, 90, 0.1);
      }
      #mic[data-muted] .wave {
        opacity: 0.5;
      }
      #mic .icon-off {
        display: none;
      }
      #mic[data-muted] .icon-on {
        display: none;
      }
      #mic[data-muted] .icon-off {
        display: block;
      }
      #stop {
        justify-self: end;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 90, 90, 0.14);
        color: #ff9d9d;
        border: 1px solid rgba(255, 122, 122, 0.35);
        border-radius: 999px;
        padding: 10px 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      #stop:hover:not(:disabled) {
        background: rgba(255, 90, 90, 0.25);
      }
      #stop:disabled {
        opacity: 0.35;
        cursor: default;
      }
      /* ── Transcript: side panel, one row per turn, streaming rewrites ────── */
      #transcript-panel {
        grid-area: transcript;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        overflow: hidden;
        min-height: 0;
      }
      #transcript-panel .panel-inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      #transcript-panel h2 {
        margin: 0;
        padding: 12px 14px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      #transcript {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 14px;
        line-height: 1.45;
        padding: 12px;
      }
      #transcript:empty::before {
        content: "The conversation appears here as you talk.";
        margin: auto;
        padding: 0 18px;
        text-align: center;
        font-size: 13px;
        color: #5f6b80;
      }
      .turn {
        display: flex;
        flex-direction: column;
        max-width: 92%;
        animation: rise 0.25s ease both;
      }
      .turn .who {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 4px 3px;
      }
      .turn .text {
        padding: 8px 12px;
        border-radius: 12px;
      }
      .turn.user {
        align-self: flex-end;
        align-items: flex-end;
      }
      .turn.user .text {
        background: rgba(var(--glow), 0.13);
        border: 1px solid rgba(var(--glow), 0.2);
        color: #cfe0ff;
        border-bottom-right-radius: 4px;
      }
      .turn.assistant {
        align-self: flex-start;
      }
      .turn.assistant .text {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #d7dce6;
        border-bottom-left-radius: 4px;
      }
      .turn.interrupted .text {
        opacity: 0.55;
        text-decoration: line-through;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 900px) {
        #layout {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas:
            "stage"
            "controls"
            "transcript";
        }
        #transcript-panel {
          position: static;
          height: 280px;
        }
        #transcript-panel .panel-inner {
          position: static;
          height: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .orb,
        #status::before,
        .turn {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true"></span>
      <h1>LiveAvatar × GPT-Live</h1>
    </header>
    <div id="layout">
      <div id="stage" data-state="idle">
        <video id="video" autoplay playsinline></video>
        <audio id="audio" autoplay></audio>
        <hyperframes-player id="overlay-player" autoplay muted></hyperframes-player>
        <div id="hero">
          <h2>Learn Japanese with examples</h2>
          <p>
            Using full-duplex speech from GPT-Live and LiveAvatar + HyperFrames
            for visuals, learn various Japanese words and phrases.
          </p>
          <button id="start">Start talking</button>
          <span class="hint">Uses your microphone</span>
        </div>
        <div id="loader" aria-hidden="true">
          <span class="orb"></span>
          <span id="loader-label">starting session…</span>
        </div>
      </div>
      <div id="controls">
        <div id="status" data-kind="idle">idle</div>
        <button id="mic" disabled aria-pressed="false" title="Mute microphone" aria-label="Mute microphone">
          <svg class="icon-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4" />
          </svg>
          <svg class="icon-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4" />
            <line x1="4" y1="3" x2="20" y2="21" />
          </svg>
          <canvas class="wave" width="80" height="44" aria-hidden="true"></canvas>
        </button>
        <button id="stop" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
              transform="rotate(135 12 12)"
            />
          </svg>
          End call
        </button>
      </div>
      <aside id="transcript-panel" aria-label="transcript">
        <div class="panel-inner">
          <h2>Transcript</h2>
          <div id="transcript"></div>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
